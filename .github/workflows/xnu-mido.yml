name: xnu-mido

# Build the XNU/iOS 16 kernel for the REDMI NOTE 4X (mido, MSM8953) bring-up.
#
# mido reuses the downstream ios-sweet SWEET machine config (board identity is
# carried by the ADT + boot args, exactly like the polaris port). The board-
# specific bits live in xnu/patches-mido/* and are copied on top of the shared
# xnu/patches/* so the base xnu.yml build is never affected by mido work.
#
# NOTE (honesty, same discipline as polaris): CI proves the kernel COMPILES
# and LINKS. It does NOT prove the kernel boots on mido. mido has eMMC 5.1, not
# UFS, so the storage bring-up (and GIC-400, SMMU, framebuffer address) still
# needs real-hardware validation. See docs/MIDO.md.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (mido reuses SWEET)
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "xnu/patches-mido/**"
      - ".github/workflows/xnu-mido.yml"

concurrency:
  group: xnu-mido-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    # the kernel is pushed back to the ci-latest branch so the machine doing the
    # packaging can fetch it without a GitHub login (artifacts need one)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          # mido-only patches. 0095-* create bsd/dev/mido_*.c as new files and
          # always apply. 0096-* rewrites the fbcon block that 0003 adds (so it
          # must land after 0012, which patches inside that same block) and
          # teaches it the 24bpp/24-bit splash pitch mido uses. 0097-* repoints
          # the SWEET bootstrap console (start.s block mapping + sweet_early.c)
          # from polaris' 0x9c000000/32bpp to mido's 0x90001000/24bpp, and
          # 0098-* keeps that console off the panel (plus two pre-MMU
          # breadcrumbs in start.s) until arm_vm_init installs a real alias.
          # 0099-* maps the splash V=P again, adds a post-MMU magenta
          # breadcrumb and points the low vectors at a red-block painter, so
          # an early fault is visible instead of looking like a freeze.
          # 0100-* rewrites those two post-MMU breadcrumbs with compile-time
          # geometry: 0099's versions read boot_args through a physical pointer
          # that is only valid with the MMU off, so the probe could fault on
          # its own first load and look exactly like SCTLR_EL1 failing.
          # All of them sort after the shared patches, which is required. The
          # context-based display patch (0094) is applied MANUALLY against the
          # xnu tree (see docs/MIDO.md); it is deliberately NOT auto-applied.
          cp xnu/patches-mido/0095-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0096-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0097-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0098-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0099-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0100-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0101-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0102-*.patch dxb/patches/ 2>/dev/null || true
          # 0102-* moves the port to 4KB pages (the only granule a Cortex-A53
          # has).  0103-* follows up on the two macOS address-space assumptions
          # that 4KB then exposes: the arm64 user-VA cap (128TB -> 63GB, which
          # is what pmap's commpage assert and T0SZ=25 can actually describe)
          # and PAGE_SHIFT_CONST (stock XNU advertises 16KB for any device with
          # more than 1GB of RAM, which would contradict the 4KB tables).
          cp xnu/patches-mido/0103-*.patch dxb/patches/ 2>/dev/null || true
          # 0104-* makes the early console audible again.  0098 muted it until
          # arm_vm_init() relocated it, because the bootstrap V=P mapping of the
          # panel was then an unverified guess.  The 0100 breadcrumbs are
          # written through that mapping with the MMU on and do land, so 0104
          # trusts it, moves the mark band one row above the start.s crumbs and
          # adds a stage 0 before boot_args is dereferenced.
          cp xnu/patches-mido/0104-*.patch dxb/patches/ 2>/dev/null || true
          # 0105-* answers the first real question the console asked.  The 0104
          # kernel dies on an undefined instruction at 0xfffffff00872b5b0, which
          # is 0x2dd288 bytes past __LINKEDIT: control reached RAM nobody loaded,
          # and the address alone does not say whether that was a wild return or
          # a wild indirect call.  0105 dumps pc/lr/sp/fp/esr/far/elr and five
          # frames before panicking, and adds marks 10/11 around the two calls
          # that run between stage 4 and stage 5.
          cp xnu/patches-mido/0105-*.patch dxb/patches/ 2>/dev/null || true
          # 0107-* takes the last two ARMv8.1 features away from the kernel.
          # SWEET.h stops claiming PSTATE.PAN (a Cortex-A53 has none, and
          # __builtin_arm_rsr("pan") kills clang's backend outright with
          # `Invalid register name "pan"`), and commpage_asm.s stops grabbing
          # the pfz lock with the LSE `casa`, which needs +lse to assemble.
          # Both are hardening/optimisation dead weight on this core.  It has
          # to sort after 0102, whose SWEET.h hunk rewrites the lines below.
          cp xnu/patches-mido/0107-*.patch dxb/patches/ 2>/dev/null || true
          # 0108-* moves the early framebuffer alias into the L1 slot that
          # arm_vm_init() actually allocates.  0083 anchors it at
          # VM_MIN_KERNEL_ADDRESS + one L2 entry, which only shares a slot with
          # gVirtBase in the 16KB/large-memory layout; with 4KB pages it lands
          # 4GB+96MB away in an L1 entry nothing ever fills, and
          # arm_vm_init.c:1850 asserts.  Same panel, several 2MB blocks.
          cp xnu/patches-mido/0108-*.patch dxb/patches/ 2>/dev/null || true
          # 0109-* teaches the interrupt path about the GIC-400.  MSM8953 has a
          # v2 controller (memory-mapped GICC, no redistributor at all), so the
          # GICv3 code panics in find_gicr_pe_base() before a single IRQ runs.
          # The choice is made at runtime from the ADT's compatible string, so
          # polaris keeps the GICv3 path byte for byte.  It also prints the reg
          # cells, soc base, GICD_TYPER and the vtimer INTID it read, because
          # the console reported an INTID the ADT does not contain.
          cp xnu/patches-mido/0109-*.patch dxb/patches/ 2>/dev/null || true
          # 0110-* sends the self-IPI through GICD_SGIR instead of ICC_SGI1R_EL1
          # on that same controller.
          cp xnu/patches-mido/0110-*.patch dxb/patches/ 2>/dev/null || true
          # 0111-* shrinks the zone VA window.  The build runs with
          # XNU_PLATFORM_MacOSX set, which asks for ZONE_MAP_VA_SIZE = 128 GiB,
          # but a 4 KiB kernel only has VM_MIN..VM_MAX = 112 GiB of kernel VA
          # with the kernel text in the middle of it, so the "zones" claim can
          # never be located and kmem_range_init() panics right after mm
          # bootstrap.  24 GiB is what every non-macOS XNU uses.
          cp xnu/patches-mido/0111-*.patch dxb/patches/ 2>/dev/null || true
          # 0112-* makes that panic state its numbers (claim size, hint, map
          # bounds) instead of only the claim name, and prints the free / claim
          # totals one line earlier.  Diagnostics only; no behaviour change.
          cp xnu/patches-mido/0112-*.patch dxb/patches/ 2>/dev/null || true
          # 0113-* fixes the SMP topology check for MSM8953.  0078 encoded
          # SM7150's MPIDR layout (core in Aff1, Aff0 == 0); mido is
          # Cluster.Aff1 : Core.Aff0, so the first secondary died in it:
          #   SWEET CPU: invalid topology cpu=1 mpidr=0x1 count=4
          # Cluster 1 still cannot start (start.s indexes CpuDataEntries[] with
          # MPIDR & 0xffff, ml_processor_register() with the logical id), so the
          # check now accepts cluster 0 up to four cores and says so explicitly.
          cp xnu/patches-mido/0113-*.patch dxb/patches/ 2>/dev/null || true
          # 0114-* gives the GIC-400 path real cross-CPU SGIs.  0110 could only
          # signal the requesting PE, which is all initCPU() needs for its
          # self-test -- but the moment a second CPU is running, XNU sends
          # targeted IPIs (AST, TLB shootdown) and 0110's panic would fire.
          # GICD_SGIR is CPUTargetList[23:16] | SGIINTID[3:0] |
          # TargetListFilter[25:24]; cluster 0 core N is CPU interface N.
          cp xnu/patches-mido/0114-*.patch dxb/patches/ 2>/dev/null || true
          # 0115-* closes the secondary handshake.  cpu1 powered on (PSCI rc=0)
          # and ran initCPU, but never reported "came alive": the self-SGI is
          # sent while that core still has DAIF.I set, so on a GIC-400 -- whose
          # GICC_CTLR/PMR are banked per core -- it can simply be lost.  initCPU
          # now enables its own CPU interface first, startAll re-arms the IPI
          # every ~200 ms, and both sides print enough to tell "core stuck" from
          # "core up, IPI lost".
          cp xnu/patches-mido/0115-*.patch dxb/patches/ 2>/dev/null || true
          # 0116-* programs the banked SGI group on every PE.  0109's
          # distributor loops run on the boot PE only, but GICD_IGROUPR0/
          # ISENABLER0/IPRIORITYR0-7 are banked per PE for INTID 0-31
          # (ARM IHI0048B 4.3.6).  A secondary's SGI1 therefore keeps its
          # reset group (Group 0 = FIQ): an IPI aimed at it is taken as an
          # FIQ that sleh_irq()/cpu_signal_handler() never see, so the
          # handshake stalls even with the CPU interface open -- "cpu up,
          # GICC open, no came alive".  sweet_gicv2_percpu() now writes each
          # PE's own bank (IGROUPR0=Group1, IPRIORITYR, and its SGI1+vtimer
          # enable) and sweet_gicv2_sgi_probe() prints the per-core
          # group/priority/PMR the controller will actually decide with.
          cp xnu/patches-mido/0116-*.patch dxb/patches/ 2>/dev/null || true
          # 0117: mido eMMC SDHCI diagnostic root-device hook (rd=emmcroot0).
          # Take over the SDHCI host ABL left running, dump present/cap/clock/
          # power so the serial console shows the host state, then refuse to
          # mount (ENXIO, non-panicking) until the real block-I/O milestone.
          cp xnu/patches-mido/0117-*.patch dxb/patches/ 2>/dev/null || true
          # 0118: accept the 16 KiB code-signing granularity iOS arm64 userland
          # actually uses.  0102/0103 pinned PAGE_SHIFT to 12 (a Cortex-A53 has
          # no 16 KiB translation granule), so cs_validate_codedirectory()
          # rejected every Apple blob -- including the dyld shared cache -- with
          # EBADEXEC (85), and launchd died with "Library not loaded:
          # /usr/lib/libSystem.B.dylib".  The per-page hashes of such blobs are
          # waived (one 4 KiB page cannot reproduce a 16 KiB hash), everything
          # else in the blob is still validated.
          cp xnu/patches-mido/0118-*.patch dxb/patches/ 2>/dev/null || true
          # 0119: make the eMMC write path durable.  HFS+ asks for
          # DKIOCSYNCHRONIZECACHE after every journal commit and the driver
          # answered ENOTTY ("jnl: b(1,0): flushing fs disk buffer returned
          # 0x19"), so a journal commit was durable only in the card's write
          # cache; pulling power then replayed a journal over blocks that had
          # never reached flash and left a torn B-tree node
          # ("hfs_swap_BTNode: offset #0 invalid").  Implement the ioctl with
          # eMMC FLUSH_CACHE (CMD6 write-byte EXT_CSD[32] bit 0) and only when
          # something was written since the previous flush.
          cp xnu/patches-mido/0119-*.patch dxb/patches/ 2>/dev/null || true
          # 0120: make the console log readable after it has scrolled away.  The
          # fbcon serial wraps instead of scrolling, so a crash loop overwrites
          # the lines that explain it within a second and there is no way to
          # copy the text off the device (no UART, no USB, no storage driver
          # this early).  Keep the last 160 KiB of output in a ring; when
          # "fbconhalt=<word>" matches a line (or "fbconfreeze=<lines>" is
          # reached) stop live output and replay the ring one page at a time,
          # holding each page for 1.8 s, then park on the last page.  Both
          # triggers are off unless set in boot-args.
          cp xnu/patches-mido/0120-*.patch dxb/patches/ 2>/dev/null || true
          # 0121: read every filesystem write back and print the first byte
          # that differs.  A damaged catalog B-tree can mean either "the
          # driver wrote the wrong bytes" or "the bytes never reached flash";
          # this tells the two apart in the next boot log, and reports the
          # failing lba instead of leaving the strategy path silent.
          cp xnu/patches-mido/0121-*.patch dxb/patches/ 2>/dev/null || true
          # 0122: do not report a write as done until the card has programmed
          # it.  TC only means "the last byte left the FIFO"; CMD24/CMD25 are
          # R1, so DAT0 never goes busy and CMD13 is the only way to see the
          # programming phase.  HFS+ advances its journal checkpoint as soon
          # as the write looks complete, so a power cut in that window leaves
          # an empty journal over blocks that never reached flash.
          cp xnu/patches-mido/0122-*.patch dxb/patches/ 2>/dev/null || true
          # 0123: map the dyld shared cache without a slide.  dyld asks the
          # kernel to relocate every VM_PROT_SLIDE page while installing the
          # cache; on a 4 KiB-page kernel that rebase produced a cache whose
          # __DATA was subtly wrong (dyld4 aborted on a corrupt
          # PrebuiltLoaderSet with "file does not start with MH_MAGIC_64:
          # 0x696C7062 0x30307473", i.e. "bplist00"), and the cache was also
          # never found by check_np.  Map at the nominal addresses instead and
          # let dyld derive a slide of zero.  srslide=1 restores the old path.
          cp xnu/patches-mido/0123-*.patch dxb/patches/ 2>/dev/null || true
          # 0124: keep a backup of the HFS+ volume header.  The volume header
          # is the one metadata block HFS+ never journals, so a power cut
          # while it is being rewritten leaves a volume that cannot even be
          # opened ("hfs_ValidateHFSPlusVolumeHeader: unknown Volume
          # Signature : 6174", "cannot mount root, errno = 19") and the only
          # way back is reflashing 16 GiB.  Mirror the last good header into
          # the last sectors of the "userdata" partition (they are past the
          # end of the 16 GiB volume), restore it before the mount, fall back
          # to the alternate header at the volume end, and refuse to send a
          # header write whose payload is not a plausible volume header.
          cp xnu/patches-mido/0124-*.patch dxb/patches/ 2>/dev/null || true
          # 0125: map the dyld shared cache with no slide, at the point where the
          # slide is actually consumed.  0123 did it in the BSD layer and a boot
          # still showed the pager relocating the cache
          # ("vm_shared_region_slide_page() offset overflow: pageIndex=9056,
          # start_offset=0, slide_amount=120401920"), which fails the fault and
          # SIGBUSes SpringBoard.  Clear the slide and VM_PROT_SLIDE on every
          # mapping inside vm_shared_region_map_file(), before the slide count
          # is taken: no slid mappings, no shared-region pager, no rebase chain,
          # and sr_slide stays 0 so dyld sees a slide of zero.
          cp xnu/patches-mido/0125-*.patch dxb/patches/ 2>/dev/null || true
          # 0126: 0125 dropped the slide but left the mapping where dyld put it.
          # dyld folds the slide into sms_address itself, so the cache ended up
          # moved by 0x3514000 and not relocated; launchd then read
          # check_np() = 0x183514000, still computed a slide of 0x3514000 and
          # died with a signal ("initproc failed to start -- exit reason
          # namespace 2 subcode 0x0").  Subtract the slide from sms_address too,
          # so the region starts at SHARED_REGION_BASE_ARM64 and dyld derives a
          # slide of zero.
          cp xnu/patches-mido/0126-*.patch dxb/patches/ 2>/dev/null || true
          # 0127: the other boot shape dies in pmap_tte ("Attempt to demote a L2
          # block") at 0xfffffff0085c000, i.e. the first free page of the kernel
          # map, inside the 2 MiB block that covers the tail of the kernel image.
          # Print pmap_tte()'s own return address so the panic names the caller.
          cp xnu/patches-mido/0127-*.patch dxb/patches/ 2>/dev/null || true
          # The ARMv8.0 baseline lives in xnu/patches/0004-*, which is the patch
          # that creates MACHINE_FLAGS_ARM64_SWEET in the first place.  Doing it
          # here with a later patch did not work: dxb only warns when a patch
          # fails to apply, so a skipped 0106 produced a byte-identical kernel
          # that still trapped on `ldadd`.  Edit the line where it is born, and
          # let the "Every mido patch must apply" step complain if anything is
          # ever skipped again.
          # libfirehose_kernel is the one blob the XNU makefiles never see:
          # dxb builds it with `xcodebuild -target libfirehose_kernel` and the
          # libdispatch xcconfig, so MACHINE_FLAGS_ARM64_SWEET (0004) cannot
          # reach it.  dxb asks for ARCHS="x86_64 arm64e", and arm64e means
          # ARMv8.3, so its os_atomic_* lower to LSE -- six `ldadd`/`ldset`/
          # `ldclr` words that a Cortex-A53 traps on.  Those six are the panic
          # that repeated at __firehose_buffer_tracepoint_flush+0x18:
          #
          #   panic: Undefined kernel instruction
          #   pc=0xfffffff007260a0c instr=0xf8280128   ->  ldadd x8, x8, [x0]
          #
          # Adding "arm64" next to arm64e was not enough: the archive then has
          # both slices and the link still resolved the arm64e one.  Build it
          # for plain arm64 only, and pin the ISA with -mcpu as well (the
          # xcconfig's OTHER_CFLAGS is a plain assignment, so the exact value
          # has to be repeated here or -mkernel would be lost).
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64"/' dxb/build.sh
          sed -i '' 's|xcodebuild install -target libfirehose_kernel |xcodebuild install -target libfirehose_kernel OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53+crypto" |' dxb/build.sh
          # A sed that silently does not match would otherwise ship the same
          # broken archive again, and only the finished kernel would show it.
          grep -q 'ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64"' dxb/build.sh \
            || { echo "::error::could not narrow libfirehose_kernel to arm64"; exit 1; }
          grep -q 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53+crypto"' dxb/build.sh \
            || { echo "::error::could not pin libfirehose_kernel to cortex-a53"; exit 1; }
          grep -n 'target libfirehose_kernel' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      # dxb's patch loop only warns when a patch does not apply.  That is how a
      # -march change could vanish without a trace: the kernel came out
      # byte-identical and still trapped on `ldadd`.  Fail the job instead, and
      # keep the reason for the log and for PATCHES.txt on ci-latest.
      - name: Every mido patch must apply
        if: always()
        run: |
          test -f dxb/build.log || { echo "no build log"; exit 0; }
          if grep -E "Skipping patch .*/(009[4-9]|01[0-9]{2})-[^ ]*\.patch" dxb/build.log; then
            echo "::error::dxb skipped a mido patch; the kernel is not what this tree says it is"
            exit 1
          fi
          echo "all mido patches applied"

      # The kernel is arm64, so the arm64e slice of libfirehose_kernel is what
      # got pulled in -- and arm64e means ARMv8.3, i.e. LSE.  Assert the slice
      # is simply not there any more instead of guessing from the flags.
      - name: libfirehose_kernel must be plain arm64
        if: always()
        run: |
          ARCH=$(find dxb -name 'libfirehose_kernel.a' 2>/dev/null | head -1)
          test -n "$ARCH" || { echo "no libfirehose_kernel.a (build stopped earlier)"; exit 0; }
          echo "archive: $ARCH"
          lipo -info "$ARCH"
          if lipo -archs "$ARCH" | tr ' ' '\n' | grep -qx arm64e; then
            echo "::error::libfirehose_kernel still ships an arm64e slice; its LSE atomics trap on a Cortex-A53"
            exit 1
          fi
          lipo -archs "$ARCH" | tr ' ' '\n' | grep -qx arm64 \
            || { echo "::error::libfirehose_kernel has no arm64 slice"; exit 1; }
          echo "OK: arm64 only"

      # Downloading run logs of a private repo needs a token we do not have, so
      # when a build breaks, keep the tail of the log on its own orphan branch.
      - name: Publish build log on failure
        if: failure()
        run: |
          test -f dxb/build.log || exit 0
          python3 tools/ci_digest_log.py dxb/build.log ci-log-out
          git config user.email ci@mido.local
          git config user.name "mido ci"
          git checkout -q --orphan ci-log-tmp
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp ci-log-out/errors.txt ci-log-out/log.tail.txt .
          printf '%s\n' "$GITHUB_SHA" > BUILT_FROM
          git add -f errors.txt log.tail.txt BUILT_FROM
          git commit -qm "ci: failure digest from $GITHUB_SHA"
          git push -f origin HEAD:ci-log
          echo "published errors.txt and log.tail.txt to the ci-log branch"

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree-mido
          path: buildtree.tgz
          retention-days: 7

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      # A Cortex-A53 traps on every ARMv8.1 atomic, so a single stray `ldadd`
      # means a kernel that boots straight into an undefined-instruction panic.
      # The target flag is -mcpu=cortex-a53+crypto (0004); this checks the
      # bytes instead of trusting the flag -- and it scans EVERY instruction
      # section of the whole linked kernel, not just __TEXT_EXEC.
      #
      # The old check_lse.py allowed the six atomics inside libfirehose_kernel
      # as "only reached after something drains a firehose buffer".  That was
      # wrong: they run on the boot path, which is how
      # __firehose_buffer_tracepoint_flush+0x18 trapped.  There is no allowlist
      # any more; the archive itself is now built for ARMv8.0.
      - name: Verify the kernel has no ARMv8.1 atomics
        run: |
          test -f out/kernel.development.sweet || { echo "no kernel built"; exit 0; }
          python3 tools/lse_scan.py out/kernel.development.sweet
          python3 tools/check_zone_va.py out/kernel.development.sweet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-mido
          path: out/
          if-no-files-found: warn

      # Downloading an artifact of a private repo needs a GitHub login, which
      # the packaging machine does not have. Push the kernel to a single-commit
      # orphan branch instead: it is readable over the same SSH key that
      # already pushes patches, and force-pushing keeps one commit of history.
      - name: Publish kernel to ci-latest
        if: always()
        run: |
          test -f out/kernel.development.sweet || { echo "no kernel built"; exit 0; }
          git config user.email ci@mido.local
          git config user.name "mido ci"
          git checkout -q --orphan ci-latest-tmp
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp out/kernel.development.sweet kernel.development.sweet
          cp out/SHA256SUMS SHA256SUMS 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > BUILT_FROM
          # Publish what the compiler was actually told, so the packaging side
          # can verify the target ISA without a GitHub login.  .CFLAGS holds a
          # NUL byte, so strip it first or grep calls the file binary.
          {
            tr -d '\0' < dxb/build/xnu.obj/DEVELOPMENT_ARM64_SWEET/.CFLAGS \
              | grep -ao -- '-m[a-z]*=[^ ]*' | tr '\n' ' '
            echo
            grep -n 'MACHINE_FLAGS_ARM64_SWEET' dxb/xnu/makedefs/MakeInc.def
          } > FLAGS.txt 2>/dev/null || echo "no .CFLAGS found" > FLAGS.txt
          # libfirehose_kernel never sees .CFLAGS, so publish its slice list
          # and clang invocation separately; without this the only offline
          # evidence about it is "the kernel still has ldadd".
          {
            ARCH=$(find dxb -name 'libfirehose_kernel.a' | head -1)
            echo "archive: $ARCH"
            lipo -detailed_info "$ARCH" 2>&1 | grep -E 'architecture|align|cputype'
            find dxb/build -maxdepth 6 -name 'libfirehose_kernel.build' 2>/dev/null | head -3
          } > FIREHOSE.txt 2>&1 || echo "no libfirehose_kernel.a" > FIREHOSE.txt
          grep 'Skipping patch' dxb/build.log > PATCHES.txt 2>/dev/null \
            || echo "no patch was skipped" > PATCHES.txt
          cat FLAGS.txt FIREHOSE.txt PATCHES.txt
          git add -f kernel.development.sweet SHA256SUMS BUILT_FROM FLAGS.txt FIREHOSE.txt PATCHES.txt
          git commit -qm "ci: kernel from $GITHUB_SHA"
          git push -f origin HEAD:ci-latest
          echo "published $(shasum -a 256 kernel.development.sweet)"
