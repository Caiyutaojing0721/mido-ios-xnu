name: xnu-mido

# Build the XNU/iOS 16 kernel for the REDMI NOTE 4X (mido, MSM8953) bring-up.
#
# mido reuses the downstream ios-sweet SWEET machine config (board identity is
# carried by the ADT + boot args, exactly like the polaris port). The board-
# specific bits live in xnu/patches-mido/* and are copied on top of the shared
# xnu/patches/* so the base xnu.yml build is never affected by mido work.
#
# NOTE (honesty, same discipline as polaris): CI proves the kernel COMPILES
# and LINKS. It does NOT prove the kernel boots on mido. mido has eMMC 5.1, not
# UFS, so the storage bring-up (and GIC-400, SMMU, framebuffer address) still
# needs real-hardware validation. See docs/MIDO.md.

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (mido reuses SWEET)
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "xnu/patches-mido/**"
      - ".github/workflows/xnu-mido.yml"

concurrency:
  group: xnu-mido-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    # the kernel is pushed back to the ci-latest branch so the machine doing the
    # packaging can fetch it without a GitHub login (artifacts need one)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          # mido-only patches. 0095-* create bsd/dev/mido_*.c as new files and
          # always apply. 0096-* rewrites the fbcon block that 0003 adds (so it
          # must land after 0012, which patches inside that same block) and
          # teaches it the 24bpp/24-bit splash pitch mido uses. 0097-* repoints
          # the SWEET bootstrap console (start.s block mapping + sweet_early.c)
          # from polaris' 0x9c000000/32bpp to mido's 0x90001000/24bpp, and
          # 0098-* keeps that console off the panel (plus two pre-MMU
          # breadcrumbs in start.s) until arm_vm_init installs a real alias.
          # 0099-* maps the splash V=P again, adds a post-MMU magenta
          # breadcrumb and points the low vectors at a red-block painter, so
          # an early fault is visible instead of looking like a freeze.
          # 0100-* rewrites those two post-MMU breadcrumbs with compile-time
          # geometry: 0099's versions read boot_args through a physical pointer
          # that is only valid with the MMU off, so the probe could fault on
          # its own first load and look exactly like SCTLR_EL1 failing.
          # All of them sort after the shared patches, which is required. The
          # context-based display patch (0094) is applied MANUALLY against the
          # xnu tree (see docs/MIDO.md); it is deliberately NOT auto-applied.
          cp xnu/patches-mido/0095-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0096-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0097-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0098-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0099-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0100-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0101-*.patch dxb/patches/ 2>/dev/null || true
          cp xnu/patches-mido/0102-*.patch dxb/patches/ 2>/dev/null || true
          # 0102-* moves the port to 4KB pages (the only granule a Cortex-A53
          # has).  0103-* follows up on the two macOS address-space assumptions
          # that 4KB then exposes: the arm64 user-VA cap (128TB -> 63GB, which
          # is what pmap's commpage assert and T0SZ=25 can actually describe)
          # and PAGE_SHIFT_CONST (stock XNU advertises 16KB for any device with
          # more than 1GB of RAM, which would contradict the 4KB tables).
          cp xnu/patches-mido/0103-*.patch dxb/patches/ 2>/dev/null || true
          # 0104-* makes the early console audible again.  0098 muted it until
          # arm_vm_init() relocated it, because the bootstrap V=P mapping of the
          # panel was then an unverified guess.  The 0100 breadcrumbs are
          # written through that mapping with the MMU on and do land, so 0104
          # trusts it, moves the mark band one row above the start.s crumbs and
          # adds a stage 0 before boot_args is dereferenced.
          cp xnu/patches-mido/0104-*.patch dxb/patches/ 2>/dev/null || true
          # 0105-* answers the first real question the console asked.  The 0104
          # kernel dies on an undefined instruction at 0xfffffff00872b5b0, which
          # is 0x2dd288 bytes past __LINKEDIT: control reached RAM nobody loaded,
          # and the address alone does not say whether that was a wild return or
          # a wild indirect call.  0105 dumps pc/lr/sp/fp/esr/far/elr and five
          # frames before panicking, and adds marks 10/11 around the two calls
          # that run between stage 4 and stage 5.
          cp xnu/patches-mido/0105-*.patch dxb/patches/ 2>/dev/null || true
          # The ARMv8.0 baseline lives in xnu/patches/0004-*, which is the patch
          # that creates MACHINE_FLAGS_ARM64_SWEET in the first place.  Doing it
          # here with a later patch did not work: dxb only warns when a patch
          # fails to apply, so a skipped 0106 produced a byte-identical kernel
          # that still trapped on `ldadd`.  Edit the line where it is born, and
          # let the "Every mido patch must apply" step complain if anything is
          # ever skipped again.
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      # dxb's patch loop only warns when a patch does not apply.  That is how a
      # -march change could vanish without a trace: the kernel came out
      # byte-identical and still trapped on `ldadd`.  Fail the job instead, and
      # keep the reason for the log and for PATCHES.txt on ci-latest.
      - name: Every mido patch must apply
        if: always()
        run: |
          test -f dxb/build.log || { echo "no build log"; exit 0; }
          if grep -E "Skipping patch .*/(009[4-9]|01[0-9]{2})-[^ ]*\.patch" dxb/build.log; then
            echo "::error::dxb skipped a mido patch; the kernel is not what this tree says it is"
            exit 1
          fi
          echo "all mido patches applied"

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree-mido
          path: buildtree.tgz
          retention-days: 7

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      # A Cortex-A53 traps on every ARMv8.1 atomic, so a single stray `ldadd`
      # means a kernel that boots to an undefined-instruction panic.  0106
      # narrows -march; this checks the bytes instead of trusting the flag.
      - name: Verify the kernel has no ARMv8.1 atomics
        run: |
          test -f out/kernel.development.sweet || { echo "no kernel built"; exit 0; }
          python3 tools/check_lse.py out/kernel.development.sweet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-mido
          path: out/
          if-no-files-found: warn

      # Downloading an artifact of a private repo needs a GitHub login, which
      # the packaging machine does not have. Push the kernel to a single-commit
      # orphan branch instead: it is readable over the same SSH key that
      # already pushes patches, and force-pushing keeps one commit of history.
      - name: Publish kernel to ci-latest
        if: always()
        run: |
          test -f out/kernel.development.sweet || { echo "no kernel built"; exit 0; }
          git config user.email ci@mido.local
          git config user.name "mido ci"
          git checkout -q --orphan ci-latest-tmp
          git rm -rq --cached . >/dev/null 2>&1 || true
          cp out/kernel.development.sweet kernel.development.sweet
          cp out/SHA256SUMS SHA256SUMS 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > BUILT_FROM
          # Publish what the compiler was actually told, so the packaging side
          # can verify the target ISA without a GitHub login.  .CFLAGS holds a
          # NUL byte, so strip it first or grep calls the file binary.
          {
            tr -d '\0' < dxb/build/xnu.obj/DEVELOPMENT_ARM64_SWEET/.CFLAGS \
              | grep -ao -- '-m[a-z]*=[^ ]*' | tr '\n' ' '
            echo
            grep -n 'MACHINE_FLAGS_ARM64_SWEET' dxb/xnu/makedefs/MakeInc.def
          } > FLAGS.txt 2>/dev/null || echo "no .CFLAGS found" > FLAGS.txt
          grep 'Skipping patch' dxb/build.log > PATCHES.txt 2>/dev/null \
            || echo "no patch was skipped" > PATCHES.txt
          cat FLAGS.txt PATCHES.txt
          git add -f kernel.development.sweet SHA256SUMS BUILT_FROM FLAGS.txt PATCHES.txt
          git commit -qm "ci: kernel from $GITHUB_SHA"
          git push -f origin HEAD:ci-latest
          echo "published $(shasum -a 256 kernel.development.sweet)"
